<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khalfa Smart Loans - Login</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBGnvj0KnpXcmRo63WlbISS0HyeUTbbTsg",
  authDomain: "khalfa-smart-loans.firebaseapp.com",
  projectId: "khalfa-smart-loans",
  storageBucket: "khalfa-smart-loans.firebasestorage.app",
  messagingSenderId: "13720870393",
  appId: "1:13720870393:web:11628a5d12c66c42c53128"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

window.onload = () => {
  if(localStorage.getItem("khalfa_phone")){ window.location.href="dashboard.html"; return; }
  const urlParams=new URLSearchParams(window.location.search);
  const code=urlParams.get("code");
  if(code){ document.getElementById("refCode").value=code; document.getElementById("refBox").style.display="block"; }
}

window.show = (t) => {
  document.getElementById("loginBox").style.display=t==="login"?"block":"none";
  document.getElementById("regBox").style.display=t==="reg"?"block":"none";
  document.getElementById("tabLogin").style.background=t==="login"?"#0b5fff":"#eef2f9";
  document.getElementById("tabLogin").style.color=t==="login"?"#fff":"#5a6a8a";
  document.getElementById("tabReg").style.background=t==="reg"?"#0b5fff":"#eef2f9";
  document.getElementById("tabReg").style.color=t==="reg"?"#fff":"#5a6a8a";
}

window.register = async () => {
  const phone=document.getElementById("rPhone").value.trim();
  const pass=document.getElementById("rPass").value.trim();
  const ref=document.getElementById("refCode").value.trim();
  if(!phone||phone.length<10){ alert("Enter valid phone"); return; }
  if(!pass||pass.length<4){ alert("Password min 4 chars"); return; }
  const btn=document.getElementById("rBtn"); btn.innerText="Creating..."; btn.disabled=true;
  try{
    const q=query(collection(db,"users"),where("phone","==",phone));
    const snap=await getDocs(q);
    if(!snap.empty){ alert("Phone already registered, login."); show('login'); btn.innerText="Register"; btn.disabled=false; return; }
    const myCode=Math.floor(100000+Math.random()*900000).toString();
    await addDoc(collection(db,"users"),{
      phone,password:pass,wallet:0,balance:0,myCode:myCode,referredBy:ref||null,createdAt:serverTimestamp()
    });
    localStorage.setItem("khalfa_phone",phone);
    localStorage.setItem("khalfa_code",myCode);
    alert("Account created!");
    window.location.href="dashboard.html";
  }catch(e){ alert(e.message); btn.innerText="Register"; btn.disabled=false; }
}

window.login = async () => {
  const phone=document.getElementById("lPhone").value.trim();
  const pass=document.getElementById("lPass").value.trim();
  if(!phone||!pass){ alert("Enter phone and password"); return; }
  const btn=document.getElementById("lBtn"); btn.innerText="Checking..."; btn.disabled=true;
  try{
    const q=query(collection(db,"users"),where("phone","==",phone),where("password","==",pass));
    const snap=await getDocs(q);
    if(snap.empty){ alert("Wrong phone or password"); btn.innerText="Login"; btn.disabled=false; return; }
    const data=snap.docs[0].data();
    localStorage.setItem("khalfa_phone",phone);
    localStorage.setItem("khalfa_code",data.myCode||"268917");
    window.location.href="dashboard.html";
  }catch(e){ alert(e.message); btn.innerText="Login"; btn.disabled=false; }
}
</script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:linear-gradient(135deg,#0b5fff 0%,#093bb0 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#fff;width:100%;max-width:380px;border-radius:22px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.logo{text-align:center;margin-bottom:18px}.logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#0b5fff,#1e73ff);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:#fff;font-size:28px;font-weight:bold}
.tabs{display:flex;background:#eef2f9;border-radius:12px;padding:4px;margin-bottom:18px}.tabs button{flex:1;border:none;padding:10px;border-radius:9px;font-weight:bold;cursor:pointer;transition:.2s}
.input{width:100%;padding:13px 14px;border:1px solid #e1e8f0;background:#f6f8fc;border-radius:11px;outline:none;margin-top:8px;font-size:14px}
.btn{width:100%;margin-top:14px;background:linear-gradient(135deg,#0b5fff,#1e73ff);color:#fff;border:none;padding:14px;border-radius:11px;font-weight:bold;cursor:pointer;box-shadow:0 5px 15px rgba(11,95,255,.35)}
.ref{background:#fff8e1;border:1px dashed #ffb84d;border-radius:10px;padding:10px;font-size:12px;display:none}
 small{color:#6b7a99}
</style>
</head>
<body>
<div class="card">
<div class="logo"><div class="logo-icon">K</div><b style="color:#0b5fff;font-size:20px">KHALFA</b><b style="font-size:20px;color:#0f172a"> SMART LOANS</b><br><small>Smart Investment Platform</small></div>

<div class="tabs">
<button id="tabLogin" style="background:#0b5fff;color:#fff" onclick="show('login')">Login</button>
<button id="tabReg" style="background:#eef2f9;color:#5a6a8a" onclick="show('reg')">Register</button>
</div>

<div id="loginBox">
<label style="font-size:12px;font-weight:bold">Phone Number</label>
<input id="lPhone" class="input" type="tel" placeholder="0785 344 451">
<label style="font-size:12px;font-weight:bold;margin-top:10px;display:block">Password</label>
<input id="lPass" class="input" type="password" placeholder="••••••">
<button id="lBtn" class="btn" onclick="login()">Login</button>
<p style="text-align:center;font-size:12px;margin-top:12px"><span style="color:#0b5fff;cursor:pointer" onclick="show('reg')">No account? Register</span></p>
</div>

<div id="regBox" style="display:none">
<div id="refBox" class="ref">🔗 Referral Code Detected: <b id="refCodeDisplay"></b><br>You will be under LV1 12% team</div>
<label style="font-size:12px;font-weight:bold">Phone Number</label>
<input id="rPhone" class="input" type="tel" placeholder="0785 344 451">
<label style="font-size:12px;font-weight:bold;margin-top:10px;display:block">Password</label>
<input id="rPass" class="input" type="password" placeholder="Create password (min 4)">
<label style="font-size:12px;font-weight:bold;margin-top:10px;display:block">Referral Code (Optional)</label>
<input id="refCode" class="input" type="text" placeholder="Code e.g. 268917">
<button id="rBtn" class="btn" onclick="register()">Register</button>
<p style="text-align:center;font-size:12px;margin-top:12px"><span style="color:#0b5fff;cursor:pointer" onclick="show('login')">Have account? Login</span></p>
</div>

<div style="text-align:center;margin-top:18px;font-size:11px;color:#6b7a99">Min Deposit 19,000 UGX | Min Withdraw 5,000 UGX<br>Secure & Fast</div>
</div>
<script>
const urlParams=new URLSearchParams(window.location.search); const c=urlParams.get("code"); if(c){ document.getElementById("refBox").style.display="block"; document.getElementById("refCodeDisplay") && (document.getElementById("refCodeDisplay").innerText=c); }
</script>
</body>
</html>
