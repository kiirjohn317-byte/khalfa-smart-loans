<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN</title>
<style>
body{background:#020617;color:white;font-family:Arial;padding:10px}
.card{background:#1e293b;padding:10px;border-radius:10px;margin:8px 0}
input{width:100%;padding:12px;border-radius:8px;border:0;margin:6px 0;color:#000}
button{padding:10px 15px;border:0;border-radius:8px;font-weight:bold;margin:4px}
.h{display:none}
</style>
</head>
<body>

<div id="loginBox">
<h2 style="text-align:center;color:#fbbf24">KHALFA ADMIN</h2>
<div style="background:white;padding:15px;border-radius:10px;margin-top:20px">
<input type="password" id="pw" placeholder="Password">
<button onclick="login()" style="width:100%;background:#fbbf24">LOGIN</button>
<p id="err" style="color:red"></p>
</div>
</div>

<div id="panel" class="h">
<h3>ADMIN PANEL</h3>
<button onclick="location.reload()" style="background:red;color:white">Logout</button>
<div id="stats"></div>
<div id="lists"></div>
</div>

<script>
const PASS="KHALFA2026";
function login(){
 let v=document.getElementById('pw').value;
 if(v===PASS){
  document.getElementById('loginBox').classList.add('h');
  document.getElementById('panel').classList.remove('h');
  load();
 }else{
  document.getElementById('err').innerText="Wrong! Use KHALFA2026";
 }
}
function get(k){return JSON.parse(localStorage.getItem(k)||'[]')}
function load(){
 let u=get('ku'),d=get('kd'),w=get('kw');
 document.getElementById('stats').innerHTML=`<div class=card>Users:${u.length} | Dep Pending:${d.filter(x=>x.s=='pending').length} | With Pending:${w.filter(x=>x.s=='pending').length}</div>`;
 let html="";
 html+="<div class=card><h4>Deposits</h4>";
 d.slice().reverse().forEach((o,i)=>{
  let idx=d.length-1-i;
  html+=`<div>📱${o.ph} 💰${o.a} ${o.s} ${o.s=='pending'?`<button onclick="approveD(${idx})" style="background:green;color:white">Approve</button>`:''}</div>`;
 });
 html+="</div><div class=card><h4>Users + Balance</h4>";
 u.forEach(o=>{html+=`<div>${o.p} - BALANCE: ${o.b} UGX</div>`});
 html+="</div>";
 document.getElementById('lists').innerHTML=html;
}
function approveD(i){
 let d=get('kd'); let o=d[i]; if(o.s!='pending'){return}
 o.s='approved';
 let u=get('ku'); let f=u.find(x=>x.p==o.ph); if(f){f.b+=o.a}
 localStorage.setItem('kd',JSON.stringify(d));
 localStorage.setItem('ku',JSON.stringify(u));
 load(); alert("Approved "+o.a);
}
</script>
</body>
</html>
