<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Users Balance</title><style>body{margin:0;font-family:sans-serif;background:#f5f7fb}.k{background:#0a1931;color:#fff}.c{background:#fff;border-radius:10px;padding:10px;margin:5px}.h{display:none}</style></head><body>
<div id="L" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a1931"><div class="c" style="width:300px;text-align:center"><h3>ADMIN LOGIN</h3><p style="font-size:10px">See Users Balance - 0785344451 only</p><input id="pw" type="password" placeholder="Password 0785344451" style="width:100%;padding:10px;margin-top:10px"><button onclick="login()" style="width:100%;padding:10px;background:#ffb800;border:0;border-radius:20px;font-weight:900;margin-top:10px">Login & See Balances</button></div></div>
<div id="M" class="h"><div class="k" style="padding:10px"><b>ADMIN - Users Balance</b><div style="font-size:9px;color:#ffb800">0785344451 - Secure</div><div style="display:flex;gap:3px;margin-top:6px;flex-wrap:wrap"><button onclick="tab('d')" id="bd" style="padding:5px 8px;border-radius:20px;background:#ffb800;color:#000;font-weight:900;border:0;font-size:8px">Deposits</button><button onclick="tab('w')" id="bw" style="padding:5px 8px;border-radius:20px;background:#fff;border:0;font-size:8px">Withdraws</button><button onclick="tab('u')" id="bu" style="padding:5px 8px;border-radius:20px;background:#10b981;color:#fff;font-weight:900;border:0;font-size:8px">Users Bal</button><button onclick="location.reload()" style="padding:5px 8px;border-radius:20px;background:#fff;border:0;font-size:8px">Refresh</button></div></div>
<div style="padding:6px"><div id="stats" class="c" style="display:flex;justify-content:space-around;text-align:center;font-size:9px"><div><b id="s1">0</b><br>Users</div><div><b id="s2">0</b><br>Total Bal</div><div><b id="s3">0</b><br>Pend Dep</div><div><b id="s4">0</b><br>Pend With</div></div><div id="list"></div><div class="c"><b>🔒 Restore Balance</b><input id="rp" placeholder="Phone 077..." style="width:100%;padding:6px;margin-top:4px"><input id="ra" type="number" placeholder="Amount" style="width:100%;padding:6px;margin-top:4px"><button onclick="restore()" style="width:100%;padding:8px;background:#10b981;color:#fff;border:0;border-radius:20px;font-weight:900;margin-top:4px">Restore Securely</button></div></div></div>
<script>
function G(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function S(k,v){localStorage.setItem(k,JSON.stringify(v));try{localStorage.setItem(k+'_b',JSON.stringify(v))}catch(e){}}
function login(){if(pw.value!='0785344451'){alert('Wrong!');return}L.classList.add('h');M.classList.remove('h');upd();tab('u')}
function upd(){let u=G('k_u'),d=G('k_d').filter(x=>x.s=='pending'),w=G('k_w').filter(x=>x.s=='pending');s1.innerText=u.length;s2.innerText=u.reduce((s,x)=>s+(x.bal||0),0).toLocaleString();s3.innerText=d.length;s4.innerText=w.length}
function tab(t){bd.style.background=t=='d'?'#ffb800':'#fff';bw.style.background=t=='w'?'#ffb800':'#fff';bu.style.background=t=='u'?'#10b981':'#fff';if(t=='d')renderD();else if(t=='w')renderW();else renderU()}
function renderU(){let u=G('k_u'),i=G('k_i'),d=G('k_d'),el=document.getElementById('list');if(!u.length){el.innerHTML='<div class=c style=text-align:center>No users</div>';return}el.innerHTML=`<div class=c><b>👥 Users Balance (${u.length}) - Secure</b></div>`+u.sort((a,b)=>(b.bal||0)-(a.bal||0)).map(x=>{let r=i.filter(z=>z.ph==x.phone);return `<div class=c style=border-left:4px solid ${x.bal>0?'#10b981':'#ddd'}><div style=display:flex;justify-content:space-between><div><b style=font-size:11px>📱 ${x.phone}</b><span style=font-size:8px;background:#0a1931;color:#ffb800;padding:2px 5px;border-radius:10px;margin-left:4px>${x.code}</span><div style=font-size:11px>💰 <b style=color:#10b981>${(x.bal||0).toLocaleString()} UGX</b> ${x.bal>0?'🔒':''}</div><div style=font-size:8px;color:gray>Refs:${(x.refs||[]).length} Rent:${r.length} (${r.reduce((s,z)=>s+z.amt,0).toLocaleString()}) Inv:${x.inv||'None'}</div></div><div style=text-align:right><div style=font-size:7px;background:${x.bal>0?'#d1fae5':'#fee2e2'};padding:3px 6px;border-radius:10px;font-weight:900>${x.bal>0?'HAS MONEY':'NO BAL'}</div><button onclick="viewU('${x.phone}')" style=margin-top:4px;padding:3px 6px;border-radius:10px;background:#0a1931;color:#ffb800;border:0;font-size:7px>Details</button></div></div></div>`}).join('')}
function viewU(ph){let u=G('k_u').find(x=>x.phone==ph),i=G('k_i').filter(x=>x.ph==ph),d=G('k_d').filter(x=>x.ph==ph),w=G('k_w').filter(x=>x.ph==ph);alert(`USER ${ph}\nBal: ${u.bal} UGX SECURED\nRentals:${i.length}\n${i.map(x=>x.n+' '+x.amt).join('\\n')||'None'}\nDeposits:${d.length}\n${d.map(x=>x.a+' '+x.s+' '+x.tx).join('\\n')||'None'}\nWithdraws:${w.length}\nCode:${u.code} Refs:${(u.refs||[]).length}`)}
function renderD(){let d=G('k_d').filter(x=>x.s=='pending'),el=document.getElementById('list');if(!d.length){el.innerHTML='<div class=c style=text-align:center>No pending deposits - Check 0785344451 MoMo</div>';return}el.innerHTML=d.map(o=>`<div class=c style=border-left:4px solid #f59e0b><div style=display:flex;justify-content:space-between><div><b style=font-size:11px>${o.a.toLocaleString()} UGX - ${o.ph}</b><div style=font-size:8px>TxID:${o.tx}</div><div style=font-size:7px>${new Date(o.t).toLocaleString()}</div></div><span style=font-size:7px;background:#fef3c7;padding:3px 6px;border-radius:10px;font-weight:900;height:fit-content>PENDING</span></div><div style=display:flex;gap:4px;margin-top:6px><button onclick="approveD(${o.id})" style=flex:1;padding:6px;background:#10b981;color:#fff;border:0;border-radius:20px;font-weight:900;font-size:9px>✓ Approve & Add Bal</button><button onclick="rejectD(${o.id})" style=padding:6px;background:#fee2e2;color:#b91c1c;border:0;border-radius:10px;font-size:9px>Reject</button></div></div>`).join('')}
function renderW(){let w=G('k_w').filter(x=>x.s=='pending'),el=document.getElementById('list');if(!w.length){el.innerHTML='<div class=c style=text-align:center>No pending withdraws</div>';return}el.innerHTML=w.map(o=>`<div class=c style=border-left:4px solid #f59e0b><div style=display:flex;justify-content:space-between><div><b style=font-size:11px>${o.a.toLocaleString()} - ${o.ph}</b><div style=font-size:8px>To:${o.to}</div></div><span style=font-size:7px;background:#fef3c7;padding:3px 6px;border-radius:10px;font-weight:900>PENDING</span></div><div style=display:flex;gap:4px;margin-top:6px><button onclick="approveW(${o.id})" style=flex:1;padding:6px;background:#0a1931;color:#ffb800;border:0;border-radius:20px;font-weight:900;font-size:9px>✓ Paid via 0785344451 & Approve</button><button onclick="rejectW(${o.id})" style=padding:6px;background:#fee2e2;color:#b91c1c;border:0;border-radius:10px;font-size:9px>Refund</button></div></div>`).join('')}
function approveD(id){let d=G('k_d'),o=d.find(x=>x.id==id);if(!o)return;o.s='approved';S('k_d',d);let u=G('k_u'),us=u.find(x=>x.phone==o.ph);if(us){us.bal+=o.a;us.totD=(us.totD||0)+o.a;S('k_u',u)}alert('Approved! '+o.a+' added to '+o.ph+' secured!');upd();renderD()}
function rejectD(id){let d=G('k_d'),o=d.find(x=>x.id==id);if(o)o.s='rejected';S('k_d',d);renderD();upd()}
function approveW(id){let w=G('k_w'),o=w.find(x=>x.id==id);if(!o)return;o.s='approved';S('k_w',w);alert('Withdraw approved! Paid via 0785344451');renderW();upd()}
function rejectW(id){let w=G('k_w'),o=w.find(x=>x.id==id);let u=G('k_u'),us=u.find(x=>x.phone==o.ph);if(us){us.bal+=o.a;S('k_u',u)}o.s='rejected';S('k_w',w);alert('Rejected & refunded');renderW();upd()}
function restore(){let ph=rp.value.trim(),am=parseInt(ra.value);if(!ph||!am){alert('Fill phone amount');return}let u=G('k_u'),us=u.find(x=>x.phone==ph);if(!us){alert('User not found');return}us.bal+=am;us.totD=(us.totD||0)+am;S('k_u',u);alert('Restored '+am+' to '+ph+' New:'+us.bal+' secured!');rp.value='';ra.value='';upd();renderU()}
</script></body></html>
